<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winzo Admin</title><style>body{font-family:system-ui;background:#120b20;color:#eee;padding:20px}input,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #555}button{cursor:pointer}.tx{border:1px solid #444;padding:12px;margin:8px 0;border-radius:10px}</style></head><body><h2>Winzo Admin</h2><input id="url" value="wss://winzo-authoritative-server.onrender.com" size="35"><input id="key" placeholder="ADMIN_KEY" type="password"><button id="connect">Connect</button><div id="status"></div><div id="list"></div><script>
let ws; const $=id=>document.getElementById(id); function send(m){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));}
$('connect').onclick=()=>{const u=$('url').value.trim();if(!(u.startsWith('ws://')||u.startsWith('wss://'))){$('status').textContent='Enter a valid ws:// or wss:// server URL.';return;}try{ws=new WebSocket(u);}catch(e){$('status').textContent='Invalid WebSocket URL.';return;}ws.onopen=()=>{send({type:'admin-auth',key:$('key').value});$('status').textContent='Connected';};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch{return;}if(m.type==='admin-authed'){send({type:'admin-list-transactions'});$('status').textContent='Authenticated';}if(m.type==='admin-transactions')render(m.transactions||[]);if(m.type==='admin-error'||m.type==='admin-auth-fail')$('status').textContent=m.message||'Admin authentication failed.';};ws.onclose=()=>$('status').textContent='Disconnected';};
function render(xs){const list=$('list');list.replaceChildren();for(const t of xs){const box=document.createElement('div');box.className='tx';const title=document.createElement('div');const strong=document.createElement('b');strong.textContent=String(t.type||'');title.append(strong,` — ${Number(t.amount)||0} Birr — ${String(t.username||'')} — ${String(t.status||'')}`);const detail=document.createElement('div');detail.textContent=String(t.reference||t.fullName||'');box.append(title,detail);if(t.status==='pending'){const approve=document.createElement('button');approve.textContent='Approve';approve.onclick=()=>dec(t.id,'approve');const reject=document.createElement('button');reject.textContent='Reject';reject.onclick=()=>dec(t.id,'reject');box.append(approve,reject);}list.append(box);}}
window.dec=(id,decision)=>{send({type:'admin-decision',id,decision});setTimeout(()=>send({type:'admin-list-transactions'}),300)};
</script></body></html>
