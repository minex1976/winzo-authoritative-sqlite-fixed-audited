services:
  - type: web
    name: winzo-authoritative-server
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGIN
        value: https://minex1976.github.io
      - key: SQLITE_DB_PATH
        value: /var/data/winzo.sqlite
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
    disk:
      name: winzo-data
      mountPath: /var/data
      sizeGB: 1
